# Aplikacja LibraryService
server.port=8080
spring.application.name=LibraryService
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Baza danych dla LibraryService - /library_db
spring.data.mongodb.uri=mongodb://localhost:27017/library_db
jwt.public.
management.endpoints.web.exposure.include=health,prometheus,metrics
mongock.migration-scan-package=pl.lodz.p.library.migrations
management.endpoint.health.show-details=always
spring.data.mongodb.auto-index-creation=true
jwt.secret=twoj-bardzo-dlugi-i-bezpieczny-sekret-hmac-dla-user-service