<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{app.title}">Aplikacja Library</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=${#dates.createNow().time})}"/>
    <script>
        function confirmAction(messageKey){
            const msg = messageKey || 'Czy na pewno chcesz wykonać tę operację?';
            return window.confirm(msg);
        }
    </script>
</head>
<body>
<div class="layout" th:fragment="content(breadcrumb, pageContent)">
    <header class="top">
        <nav class="breadcrumbs">
            <span><a th:href="@{/}" th:text="#{nav.home}">Strona główna</a></span>
            <span th:if="${breadcrumb}"> / <span th:text="${breadcrumb}">Ścieżka</span></span>
        </nav>
        <div class="top-row">
            <h1 th:text="#{app.header}">Biblioteka</h1>
            <div class="lang-switch" aria-label="Language switcher">
                <span class="lang-label" th:text="#{lang.title}">Język</span>
                <a class="lang-link" th:href="@{'?lang=pl'}" th:text="#{lang.pl}">PL</a>
                <a class="lang-link" th:href="@{'?lang=en'}" th:text="#{lang.en}">EN</a>
            </div>
        </div>
    </header>

    <aside class="side">
        <ul class="menu">
            <li><a th:href="@{/loans}" th:text="#{menu.loans}">Lista alokacji</a></li>
            <li><a th:href="@{/loans/new}" th:text="#{menu.newLoan}">Nowa alokacja</a></li>
            <li><a th:href="@{/readers/register}" th:text="#{menu.register}">Rejestracja czytelnika</a></li>
        </ul>
    </aside>

    <main class="content">
        <div th:insert="${pageContent}">
            <!-- Miejsce na treść strony -->
        </div>
    </main>

    <footer class="footer">
        <small>&copy; <span th:text="#{app.footer}">Library</span></small>
    </footer>
</div>
</body>
</html>
