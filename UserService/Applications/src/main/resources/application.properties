# Aplikacja UserService
server.port=8081
spring.application.name=UserService
# Połączenie z RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Baza danych dla UserService - /user_db
spring.data.mongodb.uri=mongodb://localhost:27017/user_db

jwt.private.
jwt.public.
management.endpoints.web.exposure.include=health,prometheus,metrics
mongock.migration-scan-package=pl.lodz.p.user.migrations
management.endpoint.health.show-details=always
spring.data.mongodb.auto-index-creation=true
jwt.secret=twoj-bardzo-dlugi-i-bezpieczny-sekret-hmac-dla-user-service