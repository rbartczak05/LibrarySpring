<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{loans.list.title}">Lista alokacji</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=${#dates.createNow().time})}"/>
    <script>
        function confirmEnd(){
            return confirmAction && confirmAction(document.getElementById('confirmEndMsg')?.textContent);
        }
        // AJAX – filtrowanie listy wypożyczeń
        async function loadLoans() {
            const reader = document.getElementById('filterReader').value.trim();
            const active = document.getElementById('filterActive').value;
            let url = '/api/loans';
            if (reader && active === 'all') {
                url = `/api/loans/reader_id/${encodeURIComponent(reader)}`;
            } else if (!reader && (active === 'true' || active === 'false')) {
                url = `/api/loans/active/${active}`;
            } else if (reader && (active === 'true' || active === 'false')) {
                url = `/api/loans/reader_id/${encodeURIComponent(reader)}/active/${active}`;
            }
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                let data = await res.json();
                renderLoans(data);
            } catch (e) {
                renderLoans([]);
                document.getElementById('listError').textContent = 'Nie udało się pobrać danych ('+e+').';
            }
        }
        function renderLoans(loans){
            document.getElementById('listError').textContent = '';
            const tbody = document.querySelector('#loansTable tbody');
            tbody.innerHTML = '';
            if (!loans || loans.length === 0){
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 8;
                td.textContent = document.getElementById('emptyMsg').textContent;
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }
            for (const l of loans){
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${l.id??''}</td>
                    <td>${l.active??''}</td>
                    <td>${l.startTime??''}</td>
                    <td>${l.returnTime??''}</td>
                    <td>${l.endTime??''}</td>
                    <td>${l.readerId??''}</td>
                    <td>${l.bookSetId??''}</td>
                    <td>
                        ${l.active ? `<form action="/loans/${l.id}/end" method="post" style="display:inline" onsubmit="return confirmEnd()">
                            <button type="submit">${document.getElementById('endBtnLabel').textContent}</button>
                        </form>` : ''}
                    </td>`;
                tbody.appendChild(tr);
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            loadLoans();
            document.getElementById('filterReader').addEventListener('input', loadLoans);
            document.getElementById('filterActive').addEventListener('change', loadLoans);
        });
    </script>
</head>
<body>
<div class="page" th:replace="~{layout :: content(${#messages.msgOrNull('breadcrumb.loans')}, ~{::pageContent})}">
    <div th:fragment="pageContent">
        <h2 th:text="#{loans.list.header}">Lista alokacji (wypożyczeń)</h2>

        <div id="confirmEndMsg" style="display:none" th:text="#{confirm.end}">Czy zakończyć wypożyczenie?</div>
        <div id="emptyMsg" style="display:none" th:text="#{loans.empty}">Brak alokacji</div>
        <div id="endBtnLabel" style="display:none" th:text="#{loans.end}">Zakończ</div>

        <div th:if="${success}" class="msg">
            <span th:text="#{msg.success}">Operacja zakończona powodzeniem</span>
        </div>
        <div th:if="${error}" class="error">
            <span th:text="${error}">Wystąpił błąd</span>
        </div>

        <p>
            <a th:href="@{/loans/new}" th:text="#{menu.newLoan}">Utwórz nową alokację</a>
            <a style="margin-left:12px" th:href="@{/readers/register}" th:text="#{menu.register}">Rejestracja czytelnika</a>
            <button style="margin-left:12px" onclick="loadLoans()" th:text="#{btn.refresh}">Odśwież</button>
            <br/>
        </p>

        <div class="filters">
            <label for="filterReader" th:text="#{filter.reader}">Czytelnik (ID)</label>
            <input id="filterReader" type="text" placeholder="ID">
            <label for="filterActive" th:text="#{filter.active}">Aktywność</label>
            <select id="filterActive">
                <option value="all" th:text="#{filter.all}">Wszystkie</option>
                <option value="true" th:text="#{filter.active.true}">Aktywne</option>
                <option value="false" th:text="#{filter.active.false}">Nieaktywne</option>
            </select>
        </div>

        <div class="error" id="listError"></div>

        <div class="table-responsive">
        <table id="loansTable">
            <thead>
            <tr>
                <th>ID</th>
                <th th:text="#{loan.active}">Czy aktywna</th>
                <th th:text="#{loan.start}">Start</th>
                <th th:text="#{loan.return}">Zwrócono</th>
                <th th:text="#{loan.end}">Koniec</th>
                <th th:text="#{loan.reader}">ReaderId</th>
                <th th:text="#{loan.bookset}">BookSetId</th>
                <th th:text="#{loan.actions}">Akcje</th>
            </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
        </div>
    </div>
</div>

</body>
</html>
